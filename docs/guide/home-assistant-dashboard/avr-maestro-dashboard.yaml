  - type: custom:apexcharts-card
    grid_options:
      columns: full
      rows: auto
    graph_span: 7d
    header:
      show: true
      title: Master volume in dB, last 7 days
      show_states: true
      colorize_states: true
    series:
    - entity: media_player.YOUR_RECEIVER
      attribute: volume_level
      name: Master volume
      type: area
      curve: stepline
      color: '#FF7A18'
      stroke_width: 2
      opacity: 0.22
      unit: ' dB'
      float_precision: 1
      transform: 'return x == null ? null : Number(x) * 100 - 80;'
      extend_to: now
      group_by:
        duration: 1h
        func: last
        fill: last
    apex_config:
      chart:
        height: 240
      grid:
        borderColor: rgba(255,122,24,0.12)
        strokeDashArray: 3
      yaxis:
        min: -60
        max: 0
        tickAmount: 4
        labels:
          style:
            colors: '#A6A6AD'
      xaxis:
        labels:
          style:
            colors: '#A6A6AD'
      dataLabels:
        enabled: false
      legend:
        show: false
      tooltip:
        theme: dark
    card_mod:
      style: "ha-card {\n  background: rgba(15, 15, 17, 0.72);\n  border: 1px solid rgba(255, 122, 24,\

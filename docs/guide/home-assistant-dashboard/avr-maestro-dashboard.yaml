      fill_container: true
      tap_action:
        action: perform-action
        perform_action: media_player.turn_on
        target:
          entity_id: media_player.YOUR_RECEIVER
      hold_action:
        action: more-info
      double_tap_action:
        action: none
      card_mod:
        style: "ha-card {\n  --rgb-orange: 255, 122, 24;\n  --mush-rgb-orange: 255, 122, 24;\n  --rgb-amber:\
